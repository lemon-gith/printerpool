# Copy to deploy/cloudflared/config.yml (git-ignored) for the optional cloudflared container.
# Paths are as seen *inside* the container, where this folder is mounted at /etc/cloudflared.

tunnel: <your-tunnel-id>                                   # from `cloudflared tunnel list`
credentials-file: /etc/cloudflared/<your-tunnel-id>.json   # copy the .json from ~/.cloudflared/ into this folder

ingress:
  - hostname: print.example.com                            # must match the domain given to personal-setup.sh
    service: http://app:8000                               # the app container, over PrintPool's Docker network
  - service: http_status:404
