name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: printpool
          POSTGRES_USER: printpool
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U printpool -d printpool"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_HOST: localhost
      POSTGRES_DB: printpool
      POSTGRES_USER: printpool
      POSTGRES_PASSWORD: ci-only-password
      MEDIA_ROOT: /tmp/printpool-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdir -p "$MEDIA_ROOT"
      # Backups use pg_dump/pg_restore; version 16 to match the database, like the app image.
      - name: PostgreSQL 16 client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 || sudo apt-get install -y -qq postgresql-client
          pg_dump --version
      - name: Deployment config tests
        run: python deploy/test_render_config.py
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks
        run: python manage.py check
      - name: Production settings checklist
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
          DJANGO_SECURE=1 DJANGO_ALLOWED_HOSTS=print.example.ac.uk \
          python manage.py check --deploy --fail-level WARNING
      - name: Run tests
        run: python manage.py test --verbosity 2

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Render the example configuration
        run: |
          sed 's/print.example.com/print.ci.example/' printpool.example.toml > printpool.toml
          printf 'CLOUDFLARE_TUNNEL_TOKEN=ci-only\n' > .env
          python3 deploy/render_config.py
      - name: Validate the Compose files (compose.yaml + compose.override.yaml)
        run: docker compose config --quiet
      - name: Build the app and gateway images
        run: docker compose build app gateway
