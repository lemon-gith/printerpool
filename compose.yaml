# Fixed project name so container/volume names are the same on every host, whatever the folder is called.
name: printpool

# Docker keeps container logs forever by default; cap each service at 5 x 10 MB so logs can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    # Same check an uptime monitor uses. Sent with the site's own hostname so ALLOWED_HOSTS accepts it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request as r
          host = os.environ.get("DJANGO_ALLOWED_HOSTS", "localhost").split(",")[0].strip()
          no_proxy = r.build_opener(r.ProxyHandler({}))  # talk to ourselves directly, never via a proxy
          no_proxy.open(r.Request("http://127.0.0.1:8000/health/", headers={"Host": host}), timeout=5)
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional HTTPS reverse proxy for a public server. Turned on by COMPOSE_PROFILES=proxy in .env (which
  # setup-server.sh sets in Caddy mode), so a plain `docker compose up -d` does the right thing.
  # Leave it off for local testing and behind a Cloudflare Tunnel.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  media:
  caddy_data:
