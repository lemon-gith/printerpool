{% extends "base.html" %}
{% block title %}Change password · PrintPool{% endblock %}
{% block content %}
<div class="card" style="max-width:30rem">
  <h1>Change password</h1>
  {% if user.must_change_password %}
  <p>You're using a temporary password. Please choose your own before continuing.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p><button>Change password</button></p>
  </form>
</div>
{% endblock %}
